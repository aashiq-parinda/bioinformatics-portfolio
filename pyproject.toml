[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioinformatics-portfolio"
version = "1.0.0"
description = "Professional Computational Biology & Scientific Software Engineering Portfolio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Bioinformatics Engineer", email = "engineer@example.com" }
]
keywords = [
    "bioinformatics",
    "computational-biology",
    "structural-biology",
    "phylogenetics",
    "rna-seq",
    "molecular-docking",
    "scientific-software",
    "python"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "biopython>=1.83",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "statsmodels>=0.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "black>=24.2.0",
]
workflow = [
    "snakemake>=7.32.4",
]
docking = [
    "rdkit>=2023.9.5",
]

[project.scripts]
bioseq = "projects.project_01_sequence_homology.src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "projects*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "A", "C4", "SIM", "ERA"]
ignore = ["E501", "B008", "E402", "B905"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
addopts = "-ra -q"
testpaths = [
    "tests",
    "projects/01-sequence-homology/tests",
    "projects/02-androgen-receptor-phylogenetics/tests",
    "projects/03-alphafold-structure-analysis/tests",
    "projects/04-protein-ligand-docking/tests",
    "projects/05-rna-seq/tests",
]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["shared", "projects"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
